# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official

# Disable built-in Kotlin support in AGP 9.0+ to allow standard kotlin-android plugin
android.builtInKotlin=false
android.newDsl=false

# Enable AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=true

kotlin.skip.metadata.version.check=true

# Disable VFS watch to prevent Windows file locking issues
org.gradle.vfs.watch=false
